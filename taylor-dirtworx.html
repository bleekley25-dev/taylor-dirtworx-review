<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taylor Dirtworx Inc.</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap');

  :root{
    --paper:#f6f4ef;
    --panel:#ffffff;
    --charcoal:#2c2c2c;
    --charcoal-soft:#565656;
    --steel:#a7a7a7;
    --orange:#e8732c;
    --orange-deep:#c25f22;
    --line:#e2ded4;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    color:var(--charcoal);
    font-family:'Archivo',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    background-image:
      linear-gradient(180deg, #fbfaf7 0%, var(--paper) 240px);
  }

  .page{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:0 22px 40px;
  }

  /* ---- Hero / logo ---- */
  .hero{
    padding:36px 0 22px;
    text-align:center;
  }

  .logo{
    width:100%;
    max-width:340px;
    height:auto;
    margin:0 auto;
    display:block;
  }

  .owner{
    margin-top:6px;
    font-size:16px;
    color:var(--charcoal-soft);
  }
  .owner strong{
    color:var(--charcoal);
    font-weight:700;
  }

  .divider-top{
    margin-top:26px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--orange) 20%, var(--orange) 80%, transparent);
    opacity:0.5;
  }

  /* ---- Action stack ---- */
  .actions{
    margin-top:28px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .btn{
    display:flex;
    align-items:center;
    gap:14px;
    padding:18px 20px;
    border-radius:6px;
    text-decoration:none;
    font-size:17px;
    font-weight:700;
    transition:transform 0.15s ease;
  }
  .btn:active{ transform:scale(0.98); }

  .btn svg{ width:22px; height:22px; flex:none; }

  .btn-primary{
    background:var(--orange);
    color:#fff;
    box-shadow: 0 6px 16px rgba(232,115,44,0.30);
  }
  .btn-primary .sub{
    display:block;
    font-size:12px;
    font-weight:500;
    letter-spacing:0.01em;
    opacity:0.9;
    margin-top:2px;
  }

  .btn-outline{
    background:var(--panel);
    color:var(--charcoal);
    border:1px solid var(--line);
  }
  .btn-outline svg{ color:var(--orange-deep); }
  .btn-outline .label-group{ display:flex; flex-direction:column; }
  .btn-outline .sub{
    font-size:12px;
    color:var(--charcoal-soft);
    font-weight:400;
    margin-top:2px;
  }

  /* ---- Divider ---- */
  .divider{
    margin:32px 0 20px;
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--charcoal-soft);
    font-size:12px;
    letter-spacing:0.1em;
  }
  .divider::before,.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  /* ---- Socials ---- */
  .socials{
    display:flex;
    gap:12px;
  }
  .social-link{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:14px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--panel);
    color:var(--charcoal-soft);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
  }
  .social-link svg{ width:18px; height:18px; flex:none; color:var(--steel); }

  /* ---- Footer ---- */
  .footer{
    margin-top:auto;
    padding-top:32px;
    text-align:center;
    font-size:12px;
    color:var(--charcoal-soft);
    letter-spacing:0.03em;
  }
  .footer .tag{
    color:var(--orange-deep);
    font-weight:700;
  }
</style>
</head>
